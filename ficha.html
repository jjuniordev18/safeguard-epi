<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Ficha de EPI · SondaGuard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231d4ed8'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='Arial'>🦺</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f1f5f9; --surface: #ffffff; --text: #0f172a; --text-secondary: #475569;
      --border: #e2e8f0; --primary: #4f46e5; --primary-light: #eef2ff;
      --success: #16a34a; --success-bg: #f0fdf4; --warning: #d97706; --warning-bg: #fffbeb;
      --danger: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a; --surface: #1e293b; --text: #e2e8f0; --text-secondary: #94a3b8;
        --border: #334155; --primary: #818cf8; --primary-light: #1e1b4b;
        --success: #4ade80; --success-bg: #052e16; --warning: #fbbf24; --warning-bg: #422006;
        --danger: #f87171;
      }
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 24px 16px;
    }
    .container { max-width: 480px; width: 100%; }
    .header {
      text-align: center; margin-bottom: 24px;
    }
    .header .logo { font-size: 32px; margin-bottom: 4px; }
    .header h1 { font-size: 20px; font-weight: 800; color: var(--primary); }
    .header .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; margin-bottom: 16px;
    }
    .emp-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .emp-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .emp-detail strong { color: var(--text); }
    .section-title {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-secondary);
      margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .epi-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .epi-item:last-child { border-bottom: none; }
    .epi-name { font-size: 14px; font-weight: 600; }
    .epi-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .epi-qty {
      background: var(--primary-light); color: var(--primary);
      font-size: 13px; font-weight: 700; padding: 4px 10px;
      border-radius: 999px; white-space: nowrap;
    }
    .empty { text-align: center; color: var(--text-secondary); font-size: 14px; padding: 32px 0; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px 24px; border: none; border-radius: 12px;
      font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--primary); color: #fff;
      box-shadow: 0 2px 8px rgba(79,70,229,0.3);
    }
    .btn-primary:hover { box-shadow: 0 4px 16px rgba(79,70,229,0.4); }
    .btn-outline {
      background: transparent; color: var(--primary);
      border: 1.5px solid var(--primary); margin-top: 10px;
    }
    .footer {
      text-align: center; font-size: 11px; color: var(--text-secondary);
      margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);
    }
    .badge-date {
      display: inline-block; font-size: 11px; color: var(--text-secondary);
      background: var(--bg); padding: 2px 8px; border-radius: 6px; margin-top: 4px;
    }
    .error-screen { text-align: center; padding: 60px 20px; }
    .error-screen .icon { font-size: 48px; margin-bottom: 12px; }
    .error-screen h2 { font-size: 18px; margin-bottom: 8px; }
    .error-screen p { font-size: 14px; color: var(--text-secondary); }
    @media print {
      body { background: #fff; padding: 0; }
      .btn, .footer { display: none !important; }
      .card { box-shadow: none; border: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <div class="container" id="app"></div>

  <script src="domain.js"></script>
  <script>
    const LS_KEY = 'epi_app_v7';
    const app = document.getElementById('app');

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function fmtDate(s) {
      if (!s) return '-';
      try {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
        if (m) return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('pt-BR');
        return new Date(s).toLocaleDateString('pt-BR');
      } catch (e) { return s; }
    }

    function getState() {
      try { return JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch (e) { return null; }
    }

    function getEmpId() {
      const p = new URLSearchParams(location.search);
      return Number(p.get('emp'));
    }

    function getPublicToken() {
      return new URLSearchParams(location.search).get('token') || '';
    }

    function render() {
      const id = getEmpId();
      const token = getPublicToken();
      if (!id || !token) { app.innerHTML = errorHTML('Link inválido', 'Acesse pela ficha vinculada ao QR Code.'); return; }
      const state = getState();
      if (!state) { app.innerHTML = errorHTML('Dados não encontrados', 'Abra o app SondaGuard primeiro para popular os dados.'); return; }
      const emp = state.employees.find(e => e.id === id);
      if (!emp || !emp.publicToken || emp.publicToken !== token) { app.innerHTML = errorHTML('Link inválido', 'Esta ficha não está autorizada.'); return; }
      migrateLegacyReturns(state);
      const outstanding = getOutstanding(state, id);
      const agg = {};
      getDeliveries(state).filter(d => d.employeeId === id).forEach(d => {
        (d.itens || []).forEach(it => {
          const key = itemKey(id, it.epiId, it.tam);
          if (!agg[key]) agg[key] = { nome: it.nome, ca: it.ca, qty: outstanding[key] || 0, last: d.data, tam: it.tam };
          if (!agg[key].last || new Date(d.data) > new Date(agg[key].last)) {
            agg[key].last = d.data;
            agg[key].tam = it.tam;
          }
        });
      });
      const epis = Object.values(agg).filter(a => a.qty > 0).sort((a, b) => b.qty - a.qty);
      app.innerHTML = `
        <div class="header">
          <div class="logo">🦺</div>
          <h1>SondaGuard</h1>
          <div class="subtitle">Ficha de EPI do Colaborador</div>
        </div>
        <div class="card">
          <div class="emp-name">${esc(emp.nome)}</div>
          <div class="emp-detail">
            <strong>Matrícula:</strong> ${esc(emp.matricula || '-')}<br>
            <strong>Cargo:</strong> ${esc(emp.cargo || '-')}<br>
            <strong>Admissão:</strong> ${esc(fmtDate(emp.admissao))}
          </div>
        </div>
        <div class="card">
          <div class="section-title">EPIs Entregues (${epis.length})</div>
          ${epis.length ? epis.map(a => `
            <div class="epi-item">
              <div>
                <div class="epi-name">${esc(a.nome)}</div>
                <div class="epi-meta">CA: ${esc(a.ca || '-')} · Tam: ${esc(a.tam || 'Único')}</div>
                <span class="badge-date">Última entrega: ${esc(fmtDate(a.last))}</span>
              </div>
              <div class="epi-qty">${a.qty}x</div>
            </div>
          `).join('') : '<div class="empty">Nenhum EPI registrado para este colaborador.</div>'}
        </div>
        <button class="btn btn-primary" onclick="downloadPDF()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Baixar PDF
        </button>
        <button class="btn btn-outline" onclick="shareFicha()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Compartilhar
        </button>
        <div class="footer">SondaGuard · ${new Date().getFullYear()}</div>
      `;
      window._emp = emp;
      window._epis = epis;
    }

    function errorHTML(title, msg) {
      return `<div class="error-screen"><div class="icon">⚠️</div><h2>${esc(title)}</h2><p>${esc(msg)}</p></div>`;
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const emp = window._emp;
      const epis = window._epis;
      const pageW = doc.internal.pageSize.getWidth();
      let y = 20;

      doc.setFontSize(18);
      doc.setFont('helvetica', 'bold');
      doc.text('SondaGuard', pageW / 2, y, { align: 'center' });
      y += 8;
      doc.setFontSize(10);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(100);
      doc.text('Ficha de EPI do Colaborador', pageW / 2, y, { align: 'center' });
      y += 12;

      doc.setDrawColor(200);
      doc.line(20, y, pageW - 20, y);
      y += 10;

      doc.setTextColor(0);
      doc.setFontSize(13);
      doc.setFont('helvetica', 'bold');
      doc.text(emp.nome, 20, y);
      y += 7;
      doc.setFontSize(10);
      doc.setFont('helvetica', 'normal');
      doc.text('Matricula: ' + (emp.matricula || '-'), 20, y);
      y += 6;
      doc.text('Cargo: ' + (emp.cargo || '-'), 20, y);
      y += 6;
      doc.text('Admissao: ' + (fmtDate(emp.admissao) || '-'), 20, y);
      y += 10;

      doc.line(20, y, pageW - 20, y);
      y += 8;

      doc.setFontSize(11);
      doc.setFont('helvetica', 'bold');
      doc.text('EPIs Entregues (' + epis.length + ')', 20, y);
      y += 8;

      if (epis.length === 0) {
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(100);
        doc.text('Nenhum EPI registrado.', 20, y);
      } else {
        doc.setFontSize(9);
        epis.forEach(a => {
          if (y > 270) { doc.addPage(); y = 20; }
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(0);
          doc.text(a.qty + 'x ' + a.nome, 20, y);
          y += 5;
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(80);
          doc.text('CA: ' + (a.ca || '-') + '  |  Tam: ' + (a.tam || 'Unico') + '  |  Ultima entrega: ' + fmtDate(a.last), 20, y);
          y += 8;
        });
      }

      y += 6;
      doc.line(20, y, pageW - 20, y);
      y += 8;
      doc.setFontSize(8);
      doc.setTextColor(150);
      doc.text('Gerado em ' + new Date().toLocaleString('pt-BR') + ' · SondaGuard', 20, y);

      doc.save('Ficha_EPI_' + (emp.matricula || emp.nome.replace(/\s+/g, '_')) + '.pdf');
    }

    function shareFicha() {
      if (navigator.share) {
        navigator.share({ title: 'Ficha de EPI - ' + window._emp.nome, url: location.href }).catch(() => {});
      } else {
        navigator.clipboard.writeText(location.href).then(() => alert('Link copiado!')).catch(() => {});
      }
    }

    render();
  </script>
</body>
</html>
